# =============================================================================
# PD 分离 + coord(本地混部)配置(基于 person_dev 分支代码构建)
#
# 代码基线: dev 分支
#   可用调度器(registration.go): round-robin / abc6 / least-total-load /
#   apc / least-requests (无 agentic-balancer)
# 结构来源: deploy/route-server-template.yaml(模板)
#   + 本地 PD 分离部署拓扑(参考 local-config-pd-* 系列)
#
# 启动: ENV_ROUTE_SERVER_CONFIG_PATH=<本目录> 且进程工作目录设为本目录
#   (prometheus.yaml 与日志文件按相对路径解析)
# =============================================================================
server:
  addr: 0.0.0.0
  http-port: 8002
  # 端口不能与后端实例端口(8010..8023)冲突; 缺省值为 http+10 会撞 8010
  ops-port: 8092
  name: rs-pd-coord
  infer-mode: PD
  inference-module-type: pipeline
  # PD 弹性(本地混部)路由。该节与 pipeline 里的 CoordRoute 阶段必须同时存在;
  # 只有其一会在启动时直接报错, 两节都去掉即回到基线行为。
  coord-routing:
    strategy: imbalance
    metrics-stale-seconds: 3.0
    idle-max-waiting: 0
    idle-max-running-p: 0
    idle-max-running-d: 0
    idle-max-kv-usage: 0.50
    p-hybrid-max-inflight: 2
    d-hybrid-max-inflight: 2
    local-min-input-tokens: 32768
    p-hybrid-max-input-tokens: 204800
    d-hybrid-max-input-tokens: 1024
  v1-stream-writing-enabled: true
  client-write-timeout-ms: 0
  rewrite-request-id: true
  # TLS 为必填节; 本地测试使用明文 HTTP
  tls:
    enable-https: false
    cert-file: ""
    key-file: ""
    ca-cert-file: ""
    skip-verify: false
    enable-mtls: false
  ops-tls:
    enable-https: false
    cert-file: ""
    key-file: ""
    ca-cert-file: ""
    skip-verify: false
    enable-mtls: false
  trace:
    enable-trace-token-log: false
    type:
      - log
logger:
  enabled: true
  filename: rs-pd-coord.log
  max-size: 1024
  max-age: 1
  max-backups: 10
  compress: true
  level: info
http:
  dialer-timeout: 30
  dialer-keepalive: 30
  request-timeout: 54000
  max-idle-conns: 10000
  max-idle-conns-per-host: 2000
  idle-conn-timeout: 110
instance-manager:
  instance-client-type: vllm
  required-roles:
    - prefill
    - decode
  health-check-config:
    event-threshold-interval-ms: 1000
    rest-health-common-config:
      interval-ms: 10000
      health-check-timeout-ms: 10000
      max-concurrency: 1000
      batch-size: 1
    fallback-health-checker:
      enable: true
      resume-check-interval-ms: 1000
      resume-time-ms: 90000
    available-checkers:
      rest-health:
        enable: true
        fail-on-500-directly: true
        consecutive-time: 3
      request-failures:
        enable: true
        consecutive-failure: false
        time-window-ms: 90000
        max-failures: 3
        failure-conditions:
          request-timeout: true
          status-codes: [ 500, 501, 502, 503 ]
      link-blacklist-config:
        enable: false
      hang-checker:
        enable: true
        leader-check-interval-ms: 1000
        worker-hang-tag-valid-time-ms: 10000
        hang-thresholds:
          - role: prefill
            max-non-active-time-ms: -1
            skip-non-stream: false
          - role: decode
            max-non-active-time-ms: 60000
            skip-non-stream: true
    unavailable-checkers:
      rest-health:
        enable: true
        consecutive-time: 9
  route-table:
    instance-routes:
      prefill-1:
        ip: "7.242.105.78"
        port: 8010
        role: "prefill"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      prefill-2:
        ip: "7.242.105.78"
        port: 8011
        role: "prefill"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      prefill-3:
        ip: "7.242.105.78"
        port: 8012
        role: "prefill"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      prefill-4:
        ip: "7.242.105.78"
        port: 8013
        role: "prefill"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      decode-1:
        ip: "7.242.105.78"
        port: 8020
        role: "decode"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      decode-2:
        ip: "7.242.105.78"
        port: 8021
        role: "decode"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      decode-3:
        ip: "7.242.105.78"
        port: 8022
        role: "decode"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1
      decode-4:
        ip: "7.242.105.78"
        port: 8023
        role: "decode"
        static-infos:
          max_num_seqs: "32"
          api-server-count: 1

# =============================================================================
# 基线调度器: 模板默认组合 prefill=apc + decode=abc6 (当前 dev 代码均支持)
# 如需更简单的基线(如 round-robin), 将 prefill 的 scheduler-name 换成
# round-robin / least-total-load / least-requests 并删除 apc-manager 节即可
# =============================================================================
scheduler-manager:
  system-prompt-length: 100
  slo-scheduling:
    slo-enable: false
    slo-fallback-enable: true
    slo-group-healthy-threshold: 1
  schedulers:
    - instance-role: prefill
      scheduler-name: apc # 模板默认 prefill 调度器(前缀缓存亲和)
      params:
        default-batch-size: 64   # prefill 实例返回无效 batch-size 时的默认值
        prefix-load-base: 1     # 前缀完全匹配预测时的附加基础负载
    - instance-role: decode
      scheduler-name: abc6
      params:
        max_num_seqs: "32"                 # 对应实例启动参数 max_num_seqs
        update-interval-ms: "1000"         # 开启 prometheus 后的指标刷新间隔
        metrics-overdue-interval-ms: "1000" # 同步指标时早于该时间的指标被丢弃

# prefill=apc 时必须启用 APC manager(apc 调度器 Init 会校验), 参数取自模板
apc-manager:
  enable: true
  strategies:
    hash:
      block-size-bytes: 8000 # 单个 hash 块的字节数
      max-blocks: 32 # 最大块数
      match-threshold: 0.0 # 匹配率阈值, 超过该值才执行 APC 调度
      max-entries: 32768 # 最大条目数
      max-memory-mb: 512 # 最大内存占用
      cache-ttl-sec: 3600 # 超时时间(秒)

monitor:
  monitor-client-type: prometheus
  prometheus:
    # 相对进程工作目录解析; 建议进程 CWD 设为本目录, 或改为绝对路径
    prometheus-config-path: "prometheus.yaml"
metrics:
  enable: true
  duration: 60
  metrics-collector-config-file-name: metrics_config_vllm_0.11.0.yaml

# peer-client / ops-peer-client 两节必须存在: ApplyDefaultPeerClientConfig
# 在 ops-peer-client 缺省时空指针解引用 OpsPeerClientCfg.HttpCfg(启动即 panic)
peer-client:
  send-with-domain: false
  domain: ""
  http: {}
ops-peer-client:
  send-with-domain: false
  domain: ""
  http: {}
cluster:
  type: singleton
  verbose: true
  role_candidate: true
probe:
  readiness:
    prefill: 1
    decode: 1
