infer_modes:
  - PD
  - PD-AM
description: pipeline for fully disaggregated prefill\decode mode with coord (local) elastic routing.
pipeline_cfg:
  api_endpoints:
    - path: "/v1/chat/completions"
      methods: [ "POST" ]
      handler: chat_completions_infer
    - path: "/v1/completions"
      methods: [ "POST" ]
      handler: completions_infer
    - path: "/v1/messages"
      methods: [ "POST" ]
      handler: messages_infer
  phases:
    # CoordRoute 只决策与写回：命中本地混部时预选实例并占一个在飞槽位。
    # 不需要 request_load: prompt token 直接复用 prefill_schedule 的取值口径。
    - name: coord_route
      type: CoordRoute
      span_name: prefill_stage
      stage_name: Prefill
    - name: prefill_schedule
      type: Schedule
      span_name: prefill_stage
      stage_name: Prefill
      schedule_params:
        instance_type: prefill
        skip_policy: no_skip
        request_load:
          - usage
          - text
          - bytes
      dependsOn:
        - coord_route
    - name: prefill_execute
      type: Execute
      span_name: prefill_stage
      stage_name: Prefill
      execute_params:
        instance_type: prefill
        pre_process_request_funcs:
          - coord_prepare_request
        post_process_funcs:
          - coord_post_response
        post_phase_funcs:
          - coord_post_phase
      dependsOn:
        - prefill_schedule
    - name: decode_schedule
      type: Schedule
      span_name: decode_stage
      stage_name: Decode
      schedule_params:
        instance_type: decode
        skip_policy: skip_if_coord_local
        request_load:
          - usage
          - text
          - bytes
      dependsOn:
        - prefill_execute
    - name: decode_execute
      type: Execute
      span_name: decode_stage
      stage_name: Decode
      execute_params:
        instance_type: decode
        pre_process_request_funcs:
          - decode_prepare_request
        post_process_funcs:
          - decode_post_response
        post_phase_funcs:
          - complete_post_phase
      dependsOn:
        - decode_schedule
  success_phase:
    name: pd_success
    type: default_success
  error_phase:
    name: pd_failure
    type: default_fail
