infer_modes:
  - EPD
description: pipeline for fully disaggregated encode\prefill\decode mode.
pipeline_cfg:
  api_endpoints:
    - path: "/v1/chat/completions"
      methods: [ "POST" ]
      handler: chat_completions_infer
    - path: "/v1/completions"
      methods: [ "POST" ]
      handler: completions_infer
    - path: "/v1/messages"
      methods: [ "POST" ]
      handler: messages_infer
  phases:
    - name: encode_schedule
      type: Schedule
      span_name: encode_stage
      stage_name: Encode
      schedule_params:
        instance_type: encode
        skip_policy: skip_on_zero_image
        request_load:
          - image
          - text
          - bytes
    - name: encode_execute
      type: Execute
      span_name: encode_stage
      stage_name: Encode
      execute_params:
        instance_type: encode
        pre_process_request_funcs:
          - encode_prepare_request
        post_process_funcs:
          - encode_post_response
        post_phase_funcs:
          - regular_post_phase
      dependsOn:
        - encode_schedule
    - name: prefill_schedule
      type: Schedule
      span_name: prefill_stage
      stage_name: Prefill
      schedule_params:
        instance_type: prefill
        skip_policy: no_skip
        request_load:
          - usage
          - text
          - bytes
      dependsOn:
        - encode_execute
    - name: prefill_execute
      type: Execute
      span_name: prefill_stage
      stage_name: Prefill
      execute_params:
        instance_type: prefill
        pre_process_request_funcs:
          - prefill_prepare_request
        post_process_funcs:
          - prefill_post_response
          - check_kv_transfer_params
        post_phase_funcs:
          - regular_post_phase
      dependsOn:
        - prefill_schedule
    - name: decode_schedule
      type: Schedule
      span_name: decode_stage
      stage_name: Decode
      schedule_params:
        instance_type: decode
        request_load:
          - usage
          - text
          - bytes
      dependsOn:
        - prefill_execute
    - name: decode_execute
      type: Execute
      span_name: decode_stage
      stage_name: Decode
      execute_params:
        instance_type: decode
        pre_process_request_funcs:
          - decode_prepare_request
        post_process_funcs:
          - decode_post_response
        post_phase_funcs:
          - complete_post_phase
      dependsOn:
        - decode_schedule
  success_phase:
    name: epd_success
    type: default_success
  error_phase:
    name: epd_failure
    type: default_fail
