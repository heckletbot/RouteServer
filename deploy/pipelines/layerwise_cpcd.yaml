infer_modes:
  - Layerwise-CPCD
description: pipeline for layer-wise mode multi modal mode.
pipeline_cfg:
  api_endpoints:
    - path: "/v1/chat/completions"
      methods: [ "POST" ]
      handler: chat_completions_infer
    - path: "/v1/completions"
      methods: [ "POST" ]
      handler: completions_infer
  phases:
    - name: prefill_schedule
      type: Schedule
      span_name: prefill_stage
      stage_name: Prefill
      schedule_params:
        instance_type: prefill
        request_load:
          - usage
          - text
          - bytes
    - name: prefill_execute
      type: Execute
      span_name: prefill_stage
      stage_name: Prefill
      execute_params:
        instance_type: prefill
        pre_process_request_funcs:
          - prefill_stream_prepare_request
          - layerwise_prepare_request
        post_process_funcs:
          - prefill_stream_post_response
          - first_token_post
        post_phase_funcs:
          - regular_post_phase
      dependsOn:
        - prefill_schedule
    - name: decode_schedule
      type: Schedule
      span_name: decode_stage
      stage_name: Decode
      schedule_params:
        instance_type: decode
        skip_policy: no_skip
        request_load:
          - usage
          - text
          - bytes
      config:
        req_timeout_ms: 120000
    - name: layerwise_decode_execute
      type: Execute
      span_name: decode_stage
      stage_name: Decode
      execute_params:
        instance_type: decode
        pre_process_request_funcs:
          - decode_prepare_request
        post_process_funcs:
          - wait_first_token
          - decode_post_response
        post_phase_funcs:
          - complete_post_phase
      dependsOn:
        - decode_schedule
  success_phase:
    name: layerwise_success
    type: default_success
  error_phase:
    name: layerwise_failure
    type: vllm_ascend_fail
  sub_pipelines:
    - MetaServer-CPCD