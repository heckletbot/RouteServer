infer_modes:
  - MetaServer-CPCD
description: pipeline for v1/metaserver in layer-wise multi modal mode
pipeline_cfg:
  api_endpoints:
    - path: "/v1/metaserver"
      methods: [ "POST" ]
      handler: chat_completions_infer
  phases:
    - name: wait_decode
      type: Dummy
      config:
        req_timeout_ms: 60000
  success_phase:
    name: success
    type: layerwise_success
  error_phase:
    name: failure
    type: layerwise_error
  prepare_phase:
    name: layer_meta_server_prepare
    type: meta_service_prepare
    stage_name: Prepare
    span_name: Prepare
