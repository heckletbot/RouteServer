# This file is the scraping whitelist: a metric a scheduler declares in its
# NeedStatsList is still dropped silently when it is missing here.
metrics:
  guage:
    - "vllm:num_requests_running"
    - "vllm:num_requests_waiting"
    - "vllm:kv_cache_usage_perc"
  counter:
    - "vllm:generation_tokens_total"
    - "vllm:prompt_tokens_total"
batch-size: 3
max-concurrency: 100